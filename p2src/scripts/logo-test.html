<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #070B12; display: flex; gap: 40px; align-items: center; justify-content: center; padding: 40px; flex-wrap: wrap; }
  .cell { text-align: center; }
  .label { color: #8A93A2; font: 11px sans-serif; margin-top: 8px; letter-spacing: .2em; }
</style>
</head>
<body>
  <!-- Candidate A: interlocked folded-ribbon S -->
  <div class="cell">
    <svg width="220" height="220" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="gTop" x1="0.25" y1="0" x2="0.75" y2="1">
          <stop offset="0" stop-color="#FF4D6F"/>
          <stop offset="0.55" stop-color="#E5093A"/>
          <stop offset="1" stop-color="#D60D42"/>
        </linearGradient>
        <linearGradient id="gBot" x1="0.75" y1="1" x2="0.25" y2="0">
          <stop offset="0" stop-color="#B90732"/>
          <stop offset="0.5" stop-color="#C20A42"/>
          <stop offset="1" stop-color="#E5093A"/>
        </linearGradient>
      </defs>
      <!-- top ribbon: bar + right fold-down to center tip -->
      <path d="M112,68 L400,68 L400,160 L196,292 L112,232 L112,148 Z" fill="url(#gTop)"/>
      <!-- top ribbon fold face (darker facet under the bar) -->
      <path d="M400,160 L196,292 L400,292 Z" fill="#8E0527" opacity="0.55"/>
      <!-- bottom ribbon: 180-deg rotation -->
      <path d="M400,444 L112,444 L112,352 L316,220 L400,280 L400,364 Z" fill="url(#gBot)"/>
      <path d="M112,352 L316,220 L112,220 Z" fill="#8E0527" opacity="0.55"/>
    </svg>
    <div class="label">CANDIDATE A</div>
  </div>

  <!-- Candidate B: softer ribbon, rounded joins -->
  <div class="cell">
    <svg width="220" height="220" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="gTopB" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0" stop-color="#FF4D6F"/>
          <stop offset="1" stop-color="#E5093A"/>
        </linearGradient>
        <linearGradient id="gBotB" x1="0.8" y1="1" x2="0.2" y2="0">
          <stop offset="0" stop-color="#B90732"/>
          <stop offset="1" stop-color="#E5093A"/>
        </linearGradient>
      </defs>
      <g stroke-linejoin="round">
        <path d="M132,86 L392,86 L392,158 L210,278 L132,226 L132,164 Z" fill="url(#gTopB)" stroke="url(#gTopB)" stroke-width="18"/>
        <path d="M400,160 L196,292 L400,292 Z" fill="#9E0630"/>
        <path d="M380,426 L120,426 L120,354 L302,234 L380,286 L380,348 Z" fill="url(#gBotB)" stroke="url(#gBotB)" stroke-width="18"/>
        <path d="M112,352 L316,220 L112,220 Z" fill="#9E0630"/>
      </g>
    </svg>
    <div class="label">CANDIDATE B</div>
  </div>

  <!-- Candidate C: chunky Z-fold, deeper interlock -->
  <div class="cell">
    <svg width="220" height="220" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="gTopC" x1="0.3" y1="0" x2="0.7" y2="1">
          <stop offset="0" stop-color="#FF4D6F"/>
          <stop offset="1" stop-color="#D60D42"/>
        </linearGradient>
        <linearGradient id="gBotC" x1="0.7" y1="1" x2="0.3" y2="0">
          <stop offset="0" stop-color="#B90732"/>
          <stop offset="1" stop-color="#E5093A"/>
        </linearGradient>
      </defs>
      <!-- top: bar sweeping right, folding down-left; tip tucks under bottom bar -->
      <path d="M120,64 L408,64 L408,176 L244,176 L244,272 L120,190 Z" fill="url(#gTopC)"/>
      <path d="M408,176 L244,176 L408,286 Z" fill="#9E0630"/>
      <path d="M392,448 L104,448 L104,336 L268,336 L268,240 L392,322 Z" fill="url(#gBotC)"/>
      <path d="M104,336 L268,336 L104,226 Z" fill="#9E0630"/>
    </svg>
    <div class="label">CANDIDATE C</div>
  </div>
</body>
</html>
