<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" role="img" aria-label="StreamPlay">
  <defs>
    <linearGradient id="spTopH" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#FF4D6F"/>
      <stop offset="1" stop-color="#E5093A"/>
    </linearGradient>
    <linearGradient id="spBotH" x1="0.7" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#B90732"/>
      <stop offset="1" stop-color="#E5093A"/>
    </linearGradient>
  </defs>

  <!-- Mark: folded-ribbon "S" -->
  <g transform="translate(8,18) scale(0.24)" stroke-linejoin="round" stroke-width="58">
    <path d="M118,96 L154,64 L408,64 L408,148 L270,148 L270,258 L128,206 Z" fill="url(#spTopH)" stroke="url(#spTopH)"/>
    <path d="M408,148 L270,148 L408,262 Z" fill="#A10732"/>
    <path d="M394,416 L358,448 L104,448 L104,364 L242,364 L242,254 L384,306 Z" fill="url(#spBotH)" stroke="url(#spBotH)"/>
    <path d="M104,364 L242,364 L104,250 Z" fill="#A10732"/>
  </g>

  <!-- Wordmark: Stream (off-white) + Play (crimson) -->
  <text x="128" y="96" font-family="'Sora','Plus Jakarta Sans',system-ui,sans-serif" font-size="58" font-weight="800" letter-spacing="-2" fill="#F7F7F8">Stream<tspan fill="#E5093A">Play</tspan></text>
  <!-- Tagline -->
  <text x="130" y="128" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-size="12.5" font-weight="600" letter-spacing="5.2" fill="#8A93A2">WATCH · EXPLORE · ENJOY</text>
</svg>
